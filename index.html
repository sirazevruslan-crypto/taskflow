<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — Корпоративный канбан</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="dark"]{--bg:#0d1117;--surface:#161b22;--card:#21262d;--border:#30363d;--accent:#7c3aed;--accent-hover:#8b5cf6;--green:#3fb950;--green-bg:rgba(35,134,54,0.15);--orange:#d2991d;--orange-bg:rgba(210,153,29,0.15);--red:#da3633;--red-bg:rgba(218,54,51,0.15);--text:#e6edf3;--text-secondary:#8b949e;--text-tertiary:#6e7681;--new:#58a6ff;--inprogress:#d2991d;--done:#3fb950;--paused:#8b949e;--archived:#6e7681;--priority-high:#da3633;--priority-medium:#d2991d;--priority-low:#3fb950;--input-bg:#0d1117;--shadow:0 8px 24px rgba(0,0,0,0.4);--shadow-sm:0 1px 3px rgba(0,0,0,0.3);--modal-overlay:rgba(0,0,0,0.7)}
[data-theme="light"]{--bg:#ffffff;--surface:#f6f8fa;--card:#ffffff;--border:#d0d7de;--accent:#6f42c1;--accent-hover:#7c4dff;--green:#1a7f37;--green-bg:rgba(26,127,55,0.1);--orange:#9a6700;--orange-bg:rgba(154,103,0,0.1);--red:#cf222e;--red-bg:rgba(207,34,46,0.1);--text:#1f2328;--text-secondary:#656d76;--text-tertiary:#8c959f;--new:#0969da;--inprogress:#9a6700;--done:#1a7f37;--paused:#656d76;--archived:#8c959f;--priority-high:#cf222e;--priority-medium:#9a6700;--priority-low:#1a7f37;--input-bg:#ffffff;--shadow:0 1px 3px rgba(31,35,40,0.12),0 8px 24px rgba(140,149,159,0.2);--shadow-sm:0 1px 2px rgba(31,35,40,0.08);--modal-overlay:rgba(0,0,0,0.4)}
:root{--radius-sm:6px;--radius:8px;--radius-lg:12px;--transition:0.2s cubic-bezier(0.4,0,0.2,1);--font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;font-size:13px;line-height:1.5;transition:background var(--transition),color var(--transition)}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
input[type="datetime-local"]{color-scheme:dark}[data-theme="light"] input[type="datetime-local"]{color-scheme:light}
.connection-bar{position:fixed;top:0;left:0;right:0;z-index:9999;padding:3px 12px;text-align:center;font-size:11px;font-weight:600;transition:all var(--transition);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;height:24px}
.connection-bar.online{background:var(--green-bg);color:var(--green)}.connection-bar.offline{background:var(--red-bg);color:var(--red)}
.connection-bar.searching{background:var(--orange-bg);color:var(--orange)}.connection-bar.syncing{background:rgba(124,58,237,0.15);color:var(--accent)}
.stats-bar{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0;flex-shrink:0}
.stat-item{display:flex;align-items:center;gap:4px;padding:4px 10px;background:var(--surface);border-radius:var(--radius-sm);border:1px solid var(--border);font-size:11px;white-space:nowrap}
.stat-item:hover{background:var(--card)}.stat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}.stat-value{font-weight:700;font-size:13px}
.sidebar{width:280px;min-width:200px;max-width:500px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:relative;flex-shrink:0;padding-top:24px}
.sidebar-resize{position:absolute;right:-3px;top:0;width:6px;height:100%;cursor:col-resize;z-index:50}.sidebar-resize:hover,.sidebar-resize.active{background:var(--accent)}
.sidebar-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;flex-shrink:0}.sidebar-header .logo{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),#a78bfa);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0}
.sidebar-user{padding:8px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary);flex-shrink:0}.sidebar-user .avatar{width:24px;height:24px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0}
.sidebar-tree{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px}
.sidebar-footer{padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.sidebar-footer button{width:100%;padding:7px 10px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);border-radius:var(--radius-sm);font-size:12px;transition:all var(--transition);text-align:left;display:flex;align-items:center;gap:7px;cursor:pointer}
.sidebar-footer button:hover{background:var(--card);color:var(--text);border-color:var(--text-tertiary)}
.dept-group{margin-bottom:4px}.dept-header{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--radius-sm);cursor:pointer;font-weight:600;font-size:13px;transition:background var(--transition)}.dept-header:hover{background:var(--card)}
.dept-header .arrow{font-size:9px;transition:transform var(--transition);width:12px;text-align:center;color:var(--text-tertiary);flex-shrink:0}.dept-header .arrow.open{transform:rotate(90deg)}
.dept-header .dept-icon{font-size:14px;flex-shrink:0;color:var(--text-secondary)}.dept-header .dept-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dept-header .dept-actions{display:none;gap:2px}.dept-header:hover .dept-actions{display:flex}
.dept-header .dept-actions button{background:none;border:none;color:var(--text-tertiary);cursor:pointer;font-size:13px;padding:2px 5px;border-radius:4px}.dept-header .dept-actions button:hover{color:var(--text);background:rgba(255,255,255,0.08)}
.projects-list{margin-left:18px;display:none}.projects-list.open{display:block}
.project-item{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;color:var(--text-secondary);transition:all var(--transition);position:relative}
.project-item:hover{background:var(--card);color:var(--text)}.project-item.active{background:var(--card);color:var(--accent);font-weight:600;box-shadow:var(--shadow-sm)}
.project-item .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}.project-item .proj-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.project-item .proj-count{font-size:10px;background:var(--border);padding:1px 6px;border-radius:8px;color:var(--text-secondary)}.project-item .proj-actions{display:none;gap:2px}.project-item:hover .proj-actions{display:flex}
.project-item .proj-actions button{background:none;border:none;color:var(--text-tertiary);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:3px}.project-item .proj-actions button:hover{color:var(--text);background:rgba(255,255,255,0.1)}
.main-panel{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;padding-top:24px}
.main-header{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--surface);flex-wrap:wrap;transition:background var(--transition),border var(--transition);flex-shrink:0}
.main-header .project-title{font-size:17px;font-weight:700;flex:1;min-width:150px;display:flex;align-items:center;gap:8px}.main-header .project-title .proj-icon{color:var(--accent);font-size:20px}
.view-toggle{display:flex;background:var(--bg);border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border)}.view-toggle button{padding:6px 12px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;font-size:12px;transition:all var(--transition);display:flex;align-items:center;gap:5px}.view-toggle button.active{background:var(--accent);color:#fff}
.btn-toolbar{padding:6px 12px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);border-radius:var(--radius-sm);cursor:pointer;font-size:12px;transition:all var(--transition);display:flex;align-items:center;gap:5px;white-space:nowrap}
.btn-toolbar:hover{background:var(--card);border-color:var(--text-tertiary);color:var(--text)}.btn-toolbar.btn-add-task{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.main-content{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.filters-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex-shrink:0}.filters-bar input,.filters-bar select{padding:7px 10px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:12px;outline:none;transition:all var(--transition)}.filters-bar input:focus,.filters-bar select:focus{border-color:var(--accent)}.filters-bar input{width:200px}.filters-bar select{cursor:pointer}
.kanban-board{display:flex;gap:14px;flex:1;min-height:0;overflow-x:auto;padding-bottom:4px}
.kanban-column{background:var(--surface);border-radius:var(--radius);width:280px;min-width:220px;display:flex;flex-direction:column;position:relative;flex-shrink:0;box-shadow:var(--shadow-sm);max-height:none;height:100%}
.col-resize-handle{position:absolute;right:-3px;top:0;width:6px;height:100%;cursor:col-resize;z-index:10}.col-resize-handle:hover,.col-resize-handle.active{background:var(--accent)}
.kanban-column.archived-column{opacity:0.7}
.column-header{padding:10px 14px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;flex-shrink:0}.column-header .col-dot{width:8px;height:8px;border-radius:50%}.col-dot.new{background:var(--new)}.col-dot.inprogress{background:var(--inprogress)}.col-dot.done{background:var(--green)}.col-dot.paused{background:var(--paused)}.col-dot.archived{background:var(--archived)}.column-header .col-count{font-size:11px;background:var(--border);padding:1px 7px;border-radius:8px;margin-left:auto;color:var(--text-secondary)}.column-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:0}.column-footer{padding:8px;flex-shrink:0}.column-footer button{width:100%;padding:8px;background:transparent;border:1px dashed var(--border);color:var(--text-tertiary);border-radius:var(--radius-sm);font-size:12px;cursor:pointer}.column-footer button:hover{border-color:var(--accent);color:var(--accent)}
.card{background:var(--card);border-radius:var(--radius-sm);padding:10px 12px;cursor:grab;box-shadow:var(--shadow-sm);flex-shrink:0;position:relative;border:2px solid transparent;overflow:hidden}
.card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.card.priority-high{border-color:var(--priority-high)}.card.priority-medium{border-color:var(--priority-medium)}.card.priority-low{border-color:var(--priority-low)}.card.archived{opacity:0.5}
.card.overdue{border-color:var(--red)!important;animation:overduePulse 1.5s infinite}
@keyframes overduePulse{0%,100%{box-shadow:0 0 6px rgba(218,54,51,0.3)}50%{box-shadow:0 0 14px rgba(218,54,51,0.7)}}
.card-title{font-size:13px;font-weight:500;margin-bottom:5px;display:flex;align-items:center;gap:4px;word-break:break-word}
.card-meta{display:flex;gap:6px;font-size:11px;color:var(--text-secondary);flex-wrap:wrap;align-items:center}
.card-due{padding:2px 6px;border-radius:4px;font-size:10px;display:flex;align-items:center;gap:3px}
.due-normal{background:var(--green-bg);color:var(--green)}.due-warning{background:var(--orange-bg);color:var(--orange)}.due-danger{background:var(--red-bg);color:var(--red)}
.card-assignee{font-size:10px;background:var(--border);padding:2px 6px;border-radius:4px}.card-checklist{font-size:10px}
.card-comment{font-size:10px;color:var(--orange);margin-top:3px;font-style:italic;word-break:break-word;overflow:hidden;text-overflow:ellipsis;max-height:28px;line-height:1.3}.card.dragging{opacity:0.4}
.priority-icon-high{font-size:13px;color:var(--red);flex-shrink:0}
.list-view{flex:1;display:flex;flex-direction:column;gap:8px;overflow-y:auto}.list-group-header{font-weight:600;font-size:12px;padding:6px 10px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--border)}.list-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-radius:var(--radius-sm);cursor:pointer;border:2px solid transparent;box-shadow:var(--shadow-sm)}.list-row:hover{background:var(--card)}.list-row.priority-high{border-color:var(--priority-high)}.list-row.priority-medium{border-color:var(--priority-medium)}.list-row.priority-low{border-color:var(--priority-low)}.list-row .task-title{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px}.list-row .task-due,.list-row .task-assignee{font-size:11px;color:var(--text-secondary)}
.modal-overlay{position:fixed;inset:0;background:var(--modal-overlay);z-index:1000;display:none;align-items:center;justify-content:center}.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius-lg);width:620px;max-width:95vw;max-height:85vh;box-shadow:0 20px 60px rgba(0,0,0,0.6);display:flex;flex-direction:column;overflow:hidden;resize:both;min-width:400px;min-height:350px}.modal-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}.modal-header input{flex:1;background:transparent;border:none;color:var(--text);font-size:16px;font-weight:600;outline:none}.modal-header button{background:none;border:none;color:var(--text-tertiary);font-size:20px;cursor:pointer}.modal-body{padding:18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}.modal-field label{display:block;font-size:11px;color:var(--text-secondary);margin-bottom:4px;text-transform:uppercase}.modal-field textarea,.modal-field input[type="text"],.modal-field input[type="datetime-local"],.modal-field select{width:100%;padding:9px 12px;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;outline:none;font-family:inherit}.modal-field textarea:focus,.modal-field input:focus,.modal-field select:focus{border-color:var(--accent)}.modal-field textarea{resize:vertical;min-height:70px}.modal-row{display:flex;gap:12px}.modal-row>*{flex:1}.checklist-items{display:flex;flex-direction:column;gap:5px}.checklist-item{display:flex;align-items:center;gap:8px}.checklist-item input[type="checkbox"]{width:15px;height:15px;accent-color:var(--accent)}.checklist-item input[type="text"]{flex:1;padding:5px 8px;background:var(--input-bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;outline:none}.checklist-item button{background:none;border:none;color:var(--text-tertiary);cursor:pointer;font-size:14px}.checklist-item button:hover{color:var(--red)}.add-checklist-btn{padding:5px 10px;background:transparent;border:1px dashed var(--border);color:var(--text-secondary);border-radius:var(--radius-sm);cursor:pointer;font-size:11px}.files-area{display:flex;flex-direction:column;gap:4px}.file-item{display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 8px;background:var(--input-bg);border-radius:4px;cursor:pointer}.file-item:hover{background:var(--card)}.file-item button{background:none;border:none;color:var(--text-tertiary);cursor:pointer;font-size:14px;flex-shrink:0}.file-item button:hover{color:var(--red)}.file-input-wrap{display:flex;gap:8px;margin-top:4px}.file-input-wrap input[type="text"]{flex:1}.file-input-wrap button{padding:7px 12px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);cursor:pointer;font-size:11px;white-space:nowrap}.file-input-wrap button:hover{background:var(--accent);color:#fff}.file-path-hint{font-size:10px;color:var(--text-tertiary);margin-top:2px}.modal-footer{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}.modal-footer button{padding:8px 14px;border-radius:var(--radius-sm);font-size:12px;transition:all var(--transition);cursor:pointer;display:flex;align-items:center;gap:5px}.btn-save{background:var(--accent);color:#fff;border:none}.btn-delete{background:transparent;color:var(--red);border:1px solid var(--red)}.btn-archive{background:transparent;color:var(--text-secondary);border:1px solid var(--border)}.btn-restore{background:transparent;color:var(--green);border:1px solid var(--green)}
.login-screen{position:fixed;inset:0;background:var(--bg);z-index:2000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}.login-screen.hidden{display:none}.login-box{background:var(--surface);padding:30px;border-radius:var(--radius-lg);border:1px solid var(--border);width:350px;text-align:center;box-shadow:var(--shadow)}.login-box h2{font-size:20px;margin-bottom:8px;color:var(--text)}.login-box select,.login-box input{padding:10px 14px;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;outline:none;width:100%;text-align:center;margin-bottom:8px}.login-box select{cursor:pointer;text-align-last:center}.login-box input:focus,.login-box select:focus{border-color:var(--accent)}.login-box button{padding:10px 24px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;cursor:pointer;width:100%}.login-box .btn-secondary{background:transparent;color:var(--text-secondary);border:1px solid var(--border);margin-top:8px}.login-error{color:var(--red);font-size:12px;margin-top:8px;display:none}
.users-panel{position:fixed;inset:0;background:var(--modal-overlay);z-index:1500;display:none;align-items:center;justify-content:center}.users-panel.open{display:flex}.users-panel-content{background:var(--surface);border-radius:var(--radius-lg);padding:20px;width:550px;max-height:75vh;overflow-y:auto;box-shadow:var(--shadow)}.users-panel-content h3{margin-bottom:14px;font-size:16px;color:var(--text)}.users-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.user-row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--card);border-radius:var(--radius-sm)}.user-row span{flex:1;font-size:12px;color:var(--text)}.user-row .user-meta{font-size:10px;color:var(--text-tertiary)}.user-row button{background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:4px 8px;border-radius:4px}.add-user-form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.add-user-form input,.add-user-form select{padding:7px 10px;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:12px;outline:none}.add-user-form button{padding:7px 14px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer}.close-panel-btn{width:100%;padding:8px;margin-top:10px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);cursor:pointer;font-size:12px}

</style>
</head>
<body>

<div class="connection-bar searching" id="connectionBar" onclick="showServerDialog()">🟡 Загрузка...</div>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div style="font-size:40px;margin-bottom:8px">&#x1f512;</div>
    <h2>TaskFlow</h2>
    <select id="loginSelect"><option value="">— Загрузка... —</option></select>
    <input type="password" id="passwordInput" placeholder="Пароль">
    <button onclick="login()">Войти</button>
    <button class="btn-secondary" onclick="refreshFromServer()">🔄 Загрузить пользователей</button>
    <button class="btn-secondary" onclick="showChangePassword()">Сменить пароль</button>
    <div class="login-error" id="loginError">Неверный пароль</div>
  </div>
</div>

<div class="users-panel" id="usersPanel"><div class="users-panel-content"><h3>👥 Управление пользователями</h3><div class="users-list" id="usersList"></div><div class="add-user-form"><input type="text" id="newUserName" placeholder="ФИО сотрудника" style="flex:1;min-width:140px"><select id="newUserRole"><option value="executor">Исполнитель</option><option value="manager">Начальник отдела</option><option value="deputy">Заместитель ген. директора</option></select><select id="newUserDept"></select><button onclick="addUser()">Добавить</button></div><button class="close-panel-btn" onclick="closeUsersPanel()">Закрыть</button></div></div>

<div class="sidebar" id="sidebar"><div class="sidebar-resize" id="sidebarResize"></div><div class="sidebar-header"><div class="logo">TF</div>TaskFlow</div><div class="sidebar-user" id="sidebarUser"></div><div class="sidebar-tree" id="sidebarTree"></div><div class="sidebar-footer" id="sidebarFooter"></div></div>

<div class="main-panel"><div class="main-header" id="mainHeader"><span class="project-title" id="projectTitle"><span class="proj-icon">📁</span> Выберите проект</span><div class="view-toggle" id="viewToggle" style="display:none"><button onclick="setView('kanban')" id="btnKanban" class="active">▦ Канбан</button><button onclick="setView('list')" id="btnList">☰ Список</button></div><button class="btn-toolbar btn-add-task" id="btnAddTaskTop" style="display:none" onclick="addTask('new')">+ Новая задача</button><button class="btn-toolbar" id="btnToggleArchive" style="display:none" onclick="toggleArchive()">📦 Архив</button><button class="btn-toolbar" onclick="exportToExcel()">📥 Excel</button></div><div class="main-content" id="mainContent"><div style="text-align:center;padding:60px;color:var(--text-secondary)"><div style="font-size:48px;color:var(--text-tertiary)">📋</div><p>Выберите проект в левой панели</p></div></div></div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)"><div class="modal" id="modal"><div class="modal-header"><input type="text" id="modalTitle" placeholder="Название задачи"><button onclick="closeModal()">&times;</button></div><div class="modal-body"><div class="modal-field"><label>Описание</label><textarea id="modalDesc" placeholder="Описание задачи..."></textarea></div><div class="modal-row"><div class="modal-field"><label>🗓 Дедлайн</label><input type="datetime-local" id="modalDue"></div><div class="modal-field"><label>Приоритет</label><select id="modalPriority"><option value="low">Низкий</option><option value="medium" selected>Средний</option><option value="high">Высокий</option></select></div></div><div class="modal-field"><label>✍ Автор</label><input type="text" id="modalAuthor" readonly style="opacity:0.7"></div><div class="modal-row"><div class="modal-field"><label>Статус</label><select id="modalStatus"><option value="new">Новые</option><option value="inprogress">В работе</option><option value="done">Готово</option><option value="paused">На паузе</option><option value="archived">Архив</option></select></div></div><div class="modal-row"><div class="modal-field"><label>👤 Ответственный</label><select id="modalAssignee"></select></div><div class="modal-field" id="delegateField" style="display:none"><label>↳ Делегировано</label><select id="modalDelegate"><option value="">— Не делегировано —</option></select></div></div><div class="modal-field"><label>☑ Чек-лист</label><div class="checklist-items" id="checklistItems"></div><button class="add-checklist-btn" onclick="addChecklistItem()">+ Добавить пункт</button></div><div class="modal-field"><label>📎 Файлы</label><div class="files-area" id="filesArea"></div><div class="file-input-wrap"><input type="text" id="filePathInput" placeholder="Z:\папка\файл.docx"><button id="btnAddFilePath" type="button">+ Добавить путь</button></div></div><div class="modal-field"><label>💬 Комментарий</label><textarea id="modalComment" placeholder="Комментарий..."></textarea></div></div><div class="modal-footer" id="modalFooter"><button class="btn-delete" onclick="deleteCurrentTask()">🗑 Удалить</button><button class="btn-archive" id="btnArchive" onclick="archiveCurrentTask()">📦 В архив</button><button class="btn-restore" id="btnRestore" onclick="restoreCurrentTask()" style="display:none">↩ Восстановить</button><button class="btn-save" onclick="saveTask()">💾 Сохранить</button></div></div></div>

<script>
// ★★★ ЗАМЕНИ НА СВОЙ URL ★★★
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw1U98k99Fkjnuiu6KHDGUFY4h2dKMPnHHc8deq-_4-n4lMKmEBGzW5HstuQPKL1xpH/exec';
const DEFAULT_ADMIN=[{id:"u1",name:"Сиразев Р.Р.",role:"director",deptId:"",login:"admin",password:"admin1"}];
let SERVER_URL=APPS_SCRIPT_URL,connectionStatus='searching',currentUser=null,data={users:[...DEFAULT_ADMIN],departments:[],projects:[],tasks:[],unread:{},notifications:{}};
let archiveTasks=[],currentView='kanban',selectedProjectId=null,editingTaskId=null,draggedTaskId=null;
let showArchive=false,filterText='',filterAssignee='all',filterDate='all',archiveLoaded=false;

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function escXml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function formatDate(d){if(!d)return'';const dt=new Date(d);return dt.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+dt.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function getDueClass(d){if(!d)return'due-normal';const now=new Date(),due=new Date(d);if(due<now)return'due-danger';if(due-now<3*86400000)return'due-warning';return'due-normal'}
function getStatusLabel(s){const m={new:'Новые',inprogress:'В работе',done:'Готово',paused:'На паузе',archived:'Архив'};return m[s]||s}
function saveLocal(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function loadLocal(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function downloadFile(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();URL.revokeObjectURL(a.href)}
function initTheme(){document.documentElement.setAttribute('data-theme',localStorage.getItem('taskflow_theme')||'dark')}
function toggleTheme(){const c=document.documentElement.getAttribute('data-theme'),n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('taskflow_theme',n)}
function isAdmin(){return currentUser&&(currentUser.role==='director'||currentUser.role==='deputy')}
function getRoleLabel(r){if(r==='director')return'Начальник управления';if(r==='deputy')return'Зам. ген. директора';if(r==='manager')return'Нач. отдела';return'Исполнитель'}

// API
async function api(m,p,b=null){
  if(!SERVER_URL)throw new Error('Нет соединения');
  const url=new URL(SERVER_URL);url.searchParams.set('path',p);url.searchParams.set('method',m);
  const token=localStorage.getItem('taskflow_token');if(token)url.searchParams.set('token',token);
  if(m==='GET'){const r=await fetch(url.toString(),{method:'GET'});if(!r.ok)throw new Error('Ошибка');return await r.json()}
  const r=await fetch(url.toString(),{method:'POST',body:JSON.stringify(b||{})});if(!r.ok)throw new Error('Ошибка');return await r.json()
}
async function apiSafe(m,p,b=null){try{return await api(m,p,b)}catch(e){throw e}}

function updateConnection(s,m){connectionStatus=s;const b=document.getElementById('connectionBar');if(!b)return;b.className='connection-bar '+s;b.innerHTML=({online:'🟢',offline:'🔴',searching:'🟡',syncing:'🟠'})[s]+' '+m}

async function loadServerData(){
  try{
    updateConnection('syncing','Загрузка...');
    const r=await api('GET','/api/data');
    if(r.users&&r.users.length>0){data=r;archiveLoaded=false;archiveTasks=[];saveLocal('taskflow_local_data',data);updateConnection('online','Подключено');populateLoginSelect();renderAll()}
  }catch(e){
    const c=loadLocal('taskflow_local_data');
    if(c&&c.users&&c.users.length>0){data=c;updateConnection('offline','Кэш');populateLoginSelect();renderAll()}
    else{updateConnection('offline','Нет данных')}
  }
}
async function loadArchiveFromServer(){if(archiveLoaded)return;try{archiveTasks=await api('GET','/api/data/archive');archiveLoaded=true;saveLocal('taskflow_archive_local',archiveTasks)}catch(e){}}
async function refreshFromServer(){updateConnection('syncing','Обновление...');await loadServerData();await loadArchiveFromServer();updateConnection('online','Готово')}

function populateLoginSelect(){const sel=document.getElementById('loginSelect');if(!sel)return;const users=(data.users&&data.users.length>0)?data.users:DEFAULT_ADMIN;sel.innerHTML='<option value="">— Выберите пользователя —</option>'+users.map(u=>`<option value="${u.login}">${esc(u.name)} (${getRoleLabel(u.role)})</option>`).join('')}

async function login(){
  const sel=document.getElementById('loginSelect'),lv=sel?.value,pw=document.getElementById('passwordInput').value.trim();
  if(!lv||!pw)return;
  try{const r=await api('POST','/api/login',{login:lv,password:pw});if(r.status==='ok'){currentUser=r.user;if(r.token)localStorage.setItem('taskflow_token',r.token);saveLocal('taskflow_user',currentUser);document.getElementById('loginScreen').classList.add('hidden');await loadServerData();updateUIForRole();renderAll();return}}catch(e){}
  const au=(data.users&&data.users.length>0)?data.users:DEFAULT_ADMIN;const u=au.find(x=>x.login===lv&&x.password===pw);
  if(u){currentUser=u;saveLocal('taskflow_user',u);document.getElementById('loginScreen').classList.add('hidden');updateUIForRole();renderAll();return}
  document.getElementById('loginError').style.display='block'
}
function showChangePassword(){const sel=document.getElementById('loginSelect'),l=sel?.value;if(!l)return;const op=prompt('Старый пароль:');if(!op)return;const au=(data.users&&data.users.length>0)?data.users:DEFAULT_ADMIN;const u=au.find(x=>x.login===l&&x.password===op);if(!u){alert('Неверный пароль');return}const np=prompt('Новый пароль:');if(!np||np.length<3)return;const cp=prompt('Подтвердите:');if(np!==cp)return;u.password=np;saveLocal('taskflow_local_data',data);apiSafe('POST','/api/users/'+u.id,{password:np}).catch(()=>{});alert('Пароль изменён!')}
function updateUIForRole(){if(!currentUser)return;document.getElementById('sidebarUser').innerHTML=`<div class="avatar">${currentUser.name.charAt(0)}</div><span>${esc(currentUser.name)} — ${getRoleLabel(currentUser.role)}</span>`;renderSidebarFooter()}
function renderSidebarFooter(){const f=document.getElementById('sidebarFooter');let h='<button onclick="addDepartment()">🏭 Добавить отдел</button>';if(isAdmin())h+='<button onclick="openUsersPanel()">👥 Пользователи</button>';h+='<button onclick="refreshFromServer()">🔄 Обновить данные</button>';h+='<div class="theme-toggle" onclick="toggleTheme()">🌓 Тема<span class="toggle-track"><span class="toggle-thumb"></span></span></div>';h+='<button onclick="logout()">🚪 Выйти</button>';f.innerHTML=h}
function logout(){currentUser=null;selectedProjectId=null;showArchive=false;archiveTasks=[];archiveLoaded=false;localStorage.removeItem('taskflow_user');localStorage.removeItem('taskflow_token');document.getElementById('loginScreen').classList.remove('hidden');populateLoginSelect();renderAll()}

function getVisibleDepartments(){if(!currentUser)return[];if(isAdmin())return data.departments||[];return(data.departments||[]).filter(d=>d.id===currentUser.deptId)}
function getVisibleProjects(){return(data.projects||[]).filter(p=>getVisibleDepartments().some(d=>d.id===p.deptId))}
function getVisibleTasks(){if(!currentUser)return[];if(isAdmin())return data.tasks||[];const dp=getVisibleProjects().map(p=>p.id);return(data.tasks||[]).filter(t=>dp.includes(t.projectId))}
function getAllTasksForProject(pid){const a=getVisibleTasks().filter(t=>t.projectId===pid);if(showArchive){const ar=archiveTasks.filter(t=>t.projectId===pid);return[...a,...ar]}return a}
function getAllVisibleTasksWithArchive(){const a=getVisibleTasks();if(showArchive)return[...a,...archiveTasks.filter(t=>getVisibleProjects().some(p=>p.id===t.projectId))];return a}
function getSubordinateUsers(){if(!currentUser)return[];if(isAdmin())return data.users.length>0?data.users:DEFAULT_ADMIN;if(currentUser.role==='manager'){const e=(data.users||[]).filter(u=>u.deptId===currentUser.deptId&&u.role==='executor');if(!e.find(u=>u.id===currentUser.id))e.unshift(currentUser);return e.length>0?e:[currentUser]}return[currentUser]}

function buildStatsBar(pt){const t=pt||[],n=t.filter(x=>x.status==='new').length,ip=t.filter(x=>x.status==='inprogress').length,d=t.filter(x=>x.status==='done').length,ps=t.filter(x=>x.status==='paused').length,ar=t.filter(x=>x.status==='archived').length,od=t.filter(x=>x.dueDate&&new Date(x.dueDate)<new Date()&&x.status!=='done'&&x.status!=='archived').length,up=t.filter(x=>{if(!x.dueDate||x.status==='done'||x.status==='archived')return false;const df=new Date(x.dueDate)-new Date();return df>0&&df<3*86400000}).length;return`<div class="stats-bar"><div class="stat-item"><span class="stat-value">${t.length}</span> всего</div><div class="stat-item"><span class="stat-dot" style="background:var(--new)"></span><span class="stat-value">${n}</span> новых</div><div class="stat-item"><span class="stat-dot" style="background:var(--inprogress)"></span><span class="stat-value">${ip}</span> в работе</div><div class="stat-item"><span class="stat-dot" style="background:var(--done)"></span><span class="stat-value">${d}</span> готово</div><div class="stat-item"><span class="stat-dot" style="background:var(--paused)"></span><span class="stat-value">${ps}</span> на паузе</div>${ar>0?`<div class="stat-item"><span class="stat-dot" style="background:var(--archived)"></span><span class="stat-value">${ar}</span> в архиве</div>`:''}<div class="stat-item"><span style="color:var(--red)">⚠</span><span class="stat-value" style="color:var(--red)">${od}</span> просрочено</div><div class="stat-item"><span style="color:var(--orange)">🕐</span><span class="stat-value" style="color:var(--orange)">${up}</span> срочно</div></div>`}

function renderAll(){renderSidebar();renderMain()}
function renderSidebar(){const t=document.getElementById('sidebarTree');if(!currentUser){t.innerHTML='';return}const de=getVisibleDepartments();let h=de.map(d=>{const pr=getVisibleProjects().filter(p=>p.deptId===d.id);const oc=localStorage.getItem('dept_open_'+d.id)!=='false'?' open':'';const ph=pr.map(p=>{const ac=selectedProjectId===p.id?' active':'';const cn=getAllTasksForProject(p.id).length;return`<div class="project-item${ac}" onclick="selectProject('${p.id}')"><span class="dot"></span><span class="proj-name">${esc(p.name)}</span><span class="proj-count">${cn}</span><span class="proj-actions"><button onclick="event.stopPropagation();renameProject('${p.id}')">✎</button><button onclick="event.stopPropagation();deleteProject('${p.id}')">✕</button></span></div>`}).join('')||'<div style="padding:6px 10px;font-size:11px;color:var(--text-tertiary)">Нет проектов</div>';return`<div class="dept-group"><div class="dept-header" onclick="toggleDept('${d.id}')"><span class="arrow${oc}">▸</span><span class="dept-icon">🏭</span><span class="dept-name">${esc(d.name)}</span><span class="dept-actions"><button onclick="event.stopPropagation();addProject('${d.id}')">+</button>${isAdmin()?`<button onclick="event.stopPropagation();renameDept('${d.id}')">✎</button><button onclick="event.stopPropagation();deleteDept('${d.id}')">✕</button>`:''}</span></div><div class="projects-list${oc}">${ph}</div></div>`}).join('');t.innerHTML=h||'<p style="padding:10px;color:var(--text-secondary)">Нет отделов. Создайте первый отдел.</p>'}
function renderMain(){const c=document.getElementById('mainContent'),ti=document.getElementById('projectTitle'),tg=document.getElementById('viewToggle'),ba=document.getElementById('btnAddTaskTop'),br=document.getElementById('btnToggleArchive');if(!selectedProjectId||!currentUser){ti.innerHTML='📁 Выберите проект';tg.style.display='none';ba.style.display='none';br.style.display='none';c.innerHTML='<div style="text-align:center;padding:60px;color:var(--text-secondary)"><div style="font-size:48px">📋</div><p>Выберите проект в левой панели</p></div>';return}const p=(data.projects||[]).find(x=>x.id===selectedProjectId);if(!p){selectedProjectId=null;renderAll();return}ti.innerHTML='📁 '+esc(p.name);tg.style.display='flex';ba.style.display='flex';br.style.display='flex';br.innerHTML=showArchive?'📦 Скрыть архив':'📦 Показать архив';document.getElementById('btnKanban').classList.toggle('active',currentView==='kanban');document.getElementById('btnList').classList.toggle('active',currentView==='list');const ts=getAllTasksForProject(selectedProjectId);c.innerHTML=buildStatsBar(ts)+buildFiltersHtml()+(currentView==='kanban'?renderKanban(ts):renderList(ts));if(currentView==='kanban')initColumnResize()}
function buildFiltersHtml(){const u=getSubordinateUsers();let o='<option value="all">Все исполнители</option>';u.forEach(x=>{o+=`<option value="${x.id}" ${filterAssignee===x.id?'selected':''}>${esc(x.name)}</option>`});return`<div class="filters-bar">🔍<input type="text" id="searchInput" placeholder="Поиск... (F)" value="${esc(filterText)}" oninput="filterText=this.value;renderMain()">👤<select onchange="filterAssignee=this.value;renderMain()">${o}</select>🗓<select onchange="filterDate=this.value;renderMain()"><option value="all">Все сроки</option><option value="overdue">Просроченные</option><option value="today">Сегодня</option><option value="tomorrow">Завтра</option><option value="week">Неделя</option></select></div>`}
function applyFilters(ts){return ts.filter(t=>{if(filterText&&!t.title.toLowerCase().includes(filterText.toLowerCase())&&!(t.description||'').toLowerCase().includes(filterText.toLowerCase()))return false;if(filterAssignee!=='all'&&t.assigneeId!==filterAssignee&&t.delegatedTo!==filterAssignee)return false;if(filterDate!=='all'&&t.dueDate){const due=new Date(t.dueDate);due.setHours(0,0,0,0);const now=new Date();now.setHours(0,0,0,0);if(filterDate==='overdue'&&due>=now)return false;if(filterDate==='today'&&due.getTime()!==now.getTime())return false;if(filterDate==='tomorrow'){const tm=new Date(now);tm.setDate(tm.getDate()+1);if(due.getTime()!==tm.getTime())return false}if(filterDate==='week'){const ew=new Date(now);ew.setDate(ew.getDate()+(7-ew.getDay()));if(due<now||due>ew)return false}}else if(filterDate!=='all')return false;return true})}
function renderKanban(ts){const ft=applyFilters(ts);const ss=[{key:'new',label:'Новые',cc:'new'},{key:'inprogress',label:'В работе',cc:'inprogress'},{key:'done',label:'Готово',cc:'done'},{key:'paused',label:'На паузе',cc:'paused'}];if(showArchive)ss.push({key:'archived',label:'Архив',cc:'archived'});return`<div class="kanban-board">${ss.map(s=>{const ct=ft.filter(t=>t.status===s.key);return`<div class="kanban-column${s.key==='archived'?' archived-column':''}" data-status="${s.key}"><div class="col-resize-handle" onmousedown="startColResize(event)"></div><div class="column-header"><span class="col-dot ${s.cc}"></span>${s.label}<span class="col-count">${ct.length}</span></div><div class="column-body" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event,'${s.key}')">${ct.map(t=>cardHtml(t)).join('')}</div>${s.key!=='archived'?`<div class="column-footer"><button onclick="addTask('${s.key}')">+ Добавить</button></div>`:''}</div>`}).join('')}</div>`}
function cardHtml(t){const a=(data.users||[]).find(u=>u.id===t.assigneeId)||DEFAULT_ADMIN.find(u=>u.id===t.assigneeId);const dl=(data.users||[]).find(u=>u.id===t.delegatedTo);const cr=(data.users||[]).find(u=>u.id===t.createdBy);const dh=t.dueDate?`<span class="card-due ${getDueClass(t.dueDate)}">🗓 ${formatDate(t.dueDate)}</span>`:'';let chain='';if(a){chain=`<span class="card-assignee">👤 ${esc(a.name)}</span>`;if(dl)chain+=`<span class="card-assignee" style="margin-left:2px">↳ ${esc(dl.name)}</span>`}if(cr)chain+=`<span class="card-assignee" style="opacity:0.7">✍ ${esc(cr.name)}</span>`;const cd=t.checklists?.filter(c=>c.done).length||0,ct=t.checklists?.length||0;const ch=ct>0?`<span class="card-checklist">☑ ${cd}/${ct}</span>`:'';let cm='';if(t.comment){const s=t.comment.length>50?esc(t.comment).substring(0,50)+'...':esc(t.comment);cm=`<div class="card-comment" title="${esc(t.comment)}">💬 ${s}</div>`}const ia=t.status==='archived';let cc=ia?' archived':'';let oi='';const now=new Date();if(t.dueDate&&t.status!=='done'&&t.status!=='archived'){if(new Date(t.dueDate)<now){cc+=' overdue';oi='<span class="card-overdue-icon" title="Просрочено">⏰</span>'}}const hi=t.priority==='high'?'<span class="priority-icon-high" title="Высокий приоритет">⚡</span>':'';return`<div class="card priority-${t.priority}${cc}" draggable="${!ia}" data-task-id="${t.id}" onclick="openTask('${t.id}')" ondragstart="${ia?'':'handleDragStart(event)'}" ondragend="handleDragEnd(event)">${oi}<div class="card-title">${hi} ${esc(t.title)}</div><div class="card-meta">${dh}${chain}${ch}</div>${cm}</div>`}
function renderList(ts){const ft=applyFilters(ts);const ss=[{key:'new',label:'Новые',cc:'new'},{key:'inprogress',label:'В работе',cc:'inprogress'},{key:'done',label:'Готово',cc:'done'},{key:'paused',label:'На паузе',cc:'paused'}];if(showArchive)ss.push({key:'archived',label:'Архив',cc:'archived'});let h='<div class="list-view">';ss.forEach(s=>{const ct=ft.filter(t=>t.status===s.key);if(ct.length===0)return;h+=`<div class="list-group-header"><span class="col-dot ${s.cc}"></span> ${s.label} (${ct.length})</div>`;ct.forEach(t=>{const a=(data.users||[]).find(u=>u.id===t.assigneeId),dl=(data.users||[]).find(u=>u.id===t.delegatedTo);let cn=a?'👤 '+esc(a.name):'';if(dl)cn+=' ↳ '+esc(dl.name);const oi=t.dueDate&&new Date(t.dueDate)<new Date()&&t.status!=='done'&&t.status!=='archived'?' ⏰':'';const hi=t.priority==='high'?'⚡ ':'';h+=`<div class="list-row priority-${t.priority}" onclick="openTask('${t.id}')"><span class="task-title">${hi}${esc(t.title)}${oi}</span><span class="task-due">${t.dueDate?'🗓 '+formatDate(t.dueDate):'—'}</span><span class="task-assignee">${cn}</span></div>`})});return h+'</div>'}

async function toggleArchive(){if(!showArchive&&!archiveLoaded)await loadArchiveFromServer();showArchive=!showArchive;renderMain()}
async function archiveCurrentTask(){if(!editingTaskId)return;await apiSafe('POST','/api/tasks/'+editingTaskId,{status:'archived'});let t=(data.tasks||[]).find(x=>x.id===editingTaskId);if(t){data.tasks=data.tasks.filter(x=>x.id!==editingTaskId);t.status='archived';archiveTasks.push(t)}closeModal();renderAll()}
async function restoreCurrentTask(){if(!editingTaskId)return;await apiSafe('POST','/api/tasks/'+editingTaskId,{status:'new'});let t=archiveTasks.find(x=>x.id===editingTaskId);if(t){archiveTasks=archiveTasks.filter(x=>x.id!==editingTaskId);t.status='new';data.tasks.push(t)}closeModal();renderAll()}

document.addEventListener('keydown',function(e){const mo=document.getElementById('modalOverlay').classList.contains('open'),ie=e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT';if(mo){if(e.code==='Enter'&&!e.ctrlKey){const ae=document.activeElement;if(ae&&ae.tagName==='TEXTAREA')return;e.preventDefault();saveTask();return}if(e.code==='Escape'){e.preventDefault();closeModal();return}return}if(ie&&!e.ctrlKey&&e.code!=='Escape')return;switch(e.code){case'KeyQ':e.preventDefault();if(currentUser){filterAssignee=currentUser.id;filterText='';renderMain()}break;case'KeyA':e.preventDefault();filterAssignee='all';filterText='';renderMain();break;case'KeyF':e.preventDefault();document.getElementById('searchInput')?.focus();break;case'KeyN':e.preventDefault();if(selectedProjectId)addTask('new');break;case'KeyV':e.preventDefault();setView(currentView==='kanban'?'list':'kanban');break;case'Escape':if(filterAssignee!=='all'||filterText!==''){e.preventDefault();filterAssignee='all';filterText='';showArchive=false;renderMain()}break}});
document.addEventListener('click',function(e){if(e.target.id==='btnAddFilePath'||e.target.closest('#btnAddFilePath')){e.preventDefault();addFilePath()}});
document.addEventListener('keydown',function(e){if(e.code==='Enter'&&e.target.id==='filePathInput'){e.preventDefault();addFilePath()}});

async function init(){
  initTheme();
  const ld=loadLocal('taskflow_local_data');
  if(ld){data=ld;if(!data.users||data.users.length===0)data.users=[...DEFAULT_ADMIN]}
  if(!data.unread)data.unread={};if(!data.notifications)data.notifications={};
  archiveTasks=loadLocal('taskflow_archive_local')||[];
  SERVER_URL=APPS_SCRIPT_URL;localStorage.setItem('taskflow_server',SERVER_URL);
  updateConnection('searching','Загрузка...');
  populateLoginSelect();
  const su=loadLocal('taskflow_user');
  if(su){currentUser=(data.users||[]).find(u=>u.id===su.id);if(currentUser){document.getElementById('loginScreen').classList.add('hidden');updateUIForRole();renderAll()}}
  else{document.getElementById('loginScreen').classList.remove('hidden')}
  loadServerData().catch(()=>{});
}
init();
</script>
</body>
</html>
